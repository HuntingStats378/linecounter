<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Line Count Tracker</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #121212;
            color: #ffffff;
        }
        .card {
            background-color: #1e1e1e;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.6);
            text-align: center;
            width: 90%;
            max-width: 520px;
        }
        h2 {
            margin-top: 0;
            margin-bottom: 1.5rem;
            font-size: 1.5rem;
            letter-spacing: -0.5px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }
        label {
            font-size: 0.85rem;
            color: #aaa;
            font-weight: 500;
        }
        input[type="text"] {
            padding: 0.75rem;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus {
            border-color: #00e676;
        }
        button {
            padding: 0.75rem;
            border-radius: 8px;
            border: none;
            background-color: #00e676;
            color: #121212;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 0.4rem;
            transition: background-color 0.2s;
        }
        button:hover {
            background-color: #00c853;
        }
        .count-container {
            margin: 1.5rem 0 0.5rem;
            padding: 1.5rem;
            background: #181818;
            border-radius: 8px;
            border: 1px solid #282828;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* 0.5s Odometer Styling */
        .odometer {
            display: inline-flex;
            font-size: 4rem;
            font-weight: 800;
            color: #00e676;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .odometer-digit {
            position: relative;
            height: 1em;
            overflow: hidden;
            display: inline-block;
        }
        .odometer-ribbon {
            display: flex;
            flex-direction: column;
            transition: transform 0.5s cubic-bezier(0.25, 1, 0.5, 1);
        }
        .odometer-num {
            height: 1em;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .status {
            margin-top: 1rem;
            font-size: 0.85rem;
            color: #888;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Live File Line Counter</h2>
        
        <div class="input-group">
            <label for="path-input">Target File Path on PC:</label>
            <input type="text" id="path-input" placeholder="e.g. C:/path/to/your/file.ndjson" />
            <button id="connect-btn">Track File</button>
        </div>

        <div class="count-container">
            <div id="odometer" class="odometer">--</div>
        </div>

        <div id="status" class="status">Enter a file path to connect</div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let payload = urlParams.get('payload');
        const initialPath = urlParams.get('path') || '';

        const pathInput = document.getElementById('path-input');
        const connectBtn = document.getElementById('connect-btn');
        const odometerDisplay = document.getElementById('odometer');
        const statusDisplay = document.getElementById('status');

        if (initialPath) {
            pathInput.value = initialPath;
        }

        let socket = null;

        function updateOdometer(newValue) {
            if (typeof newValue !== 'number') {
                odometerDisplay.textContent = '--';
                return;
            }

            const formattedStr = newValue.toLocaleString();
            
            if (odometerDisplay.dataset.value !== formattedStr) {
                odometerDisplay.dataset.value = formattedStr;
                odometerDisplay.innerHTML = '';

                [...formattedStr].forEach(char => {
                    if (/\d/.test(char)) {
                        const digitBox = document.createElement('div');
                        digitBox.className = 'odometer-digit';

                        const ribbon = document.createElement('div');
                        ribbon.className = 'odometer-ribbon';

                        for (let i = 0; i <= 9; i++) {
                            const numElem = document.createElement('div');
                            numElem.className = 'odometer-num';
                            numElem.textContent = i;
                            ribbon.appendChild(numElem);
                        }

                        digitBox.appendChild(ribbon);
                        odometerDisplay.appendChild(digitBox);

                        const targetDigit = parseInt(char, 10);
                        requestAnimationFrame(() => {
                            ribbon.style.transform = `translateY(-${targetDigit * 1}em)`;
                        });
                    } else {
                        const staticChar = document.createElement('span');
                        staticChar.textContent = char;
                        odometerDisplay.appendChild(staticChar);
                    }
                });
            } else {
                const digits = [...formattedStr].filter(c => /\d/.test(c));
                const ribbons = odometerDisplay.querySelectorAll('.odometer-ribbon');

                digits.forEach((digit, idx) => {
                    if (ribbons[idx]) {
                        ribbons[idx].style.transform = `translateY(-${parseInt(digit, 10) * 1}em)`;
                    }
                });
            }
        }

        function startConnection(targetPath) {
            if (!targetPath) {
                alert("Please enter a valid file path to track.");
                return;
            }

            if (!payload) {
                payload = prompt("Enter access password:");
                if (!payload) {
                    statusDisplay.textContent = 'Password required to connect';
                    statusDisplay.style.color = '#ff5252';
                    return;
                }
            }

            // If WebSocket is open, re-subscribe on same connection
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send(JSON.stringify({
                    action: 'subscribe',
                    path: targetPath
                }));
                updateOdometer('--');
                statusDisplay.textContent = `Tracking: ${targetPath}`;
                statusDisplay.style.color = '#00e676';
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const host = window.location.host || 'huntie-linecounter-v1.onrender.com';
            
            const wsUrl = `${protocol}//${host}?payload=${encodeURIComponent(payload)}&path=${encodeURIComponent(targetPath)}`;
            
            socket = new WebSocket(wsUrl);
            statusDisplay.textContent = 'Connecting...';
            statusDisplay.style.color = '#888';

            socket.onopen = () => {
                statusDisplay.textContent = `Tracking: ${targetPath}`;
                statusDisplay.style.color = '#00e676';
            };

            socket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    if (data.lines !== undefined) {
                        updateOdometer(data.lines);
                    }
                } catch (err) {
                    console.error('Failed to parse WebSocket message:', err);
                }
            };

            socket.onerror = () => {
                statusDisplay.textContent = 'Connection error / Unauthorized';
                statusDisplay.style.color = '#ff5252';
            };

            socket.onclose = (e) => {
                socket = null;
                if (e.code === 1008) {
                    statusDisplay.textContent = 'Unauthorized: Incorrect password';
                    statusDisplay.style.color = '#ff5252';
                    payload = null; // Prompt for password again on next try
                } else {
                    statusDisplay.textContent = 'Disconnected from server';
                    statusDisplay.style.color = '#ffaa00';
                }
            };
        }

        connectBtn.addEventListener('click', () => {
            const path = pathInput.value.trim();
            startConnection(path);
        });

        // Only auto-connect if a path was explicitly passed in the browser URL
        if (initialPath) {
            startConnection(initialPath);
        }
    </script>
</body>
</html>
